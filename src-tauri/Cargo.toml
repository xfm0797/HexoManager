[package]
name = "hexo-manager"
version = "1.2.0"
description = "HexoManager - 桌面端 Hexo 多站点管理工具"
authors = ["XFM"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hexo_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# 只保留真正用到的两个插件：
#   - dialog：前端 `@tauri-apps/plugin-dialog` 的目录/文件选择框；
#   - opener：`open_in_explorer` / `open_external` 调用系统默认程序。
# 文件读写、进程执行、自更新都由本仓库自己的命令实现（file_commands /
# utils::process / update::*），此前注册的 fs / shell / process / updater 四个
# 插件既没被 Rust 调用也没被前端调用，白白让二进制变大、还要求 capabilities
# 授予「任意路径读写 + 任意程序执行」这类高危权限 —— 已移除。
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
# 更新包签名校验（tauri-plugin-updater 已间接依赖，这里显式声明以直接使用）
minisign-verify = "0.2"
# preserve_order：让 serde_json::Value 的对象保持插入顺序（默认按字母序）。
# Front Matter 回写依赖它保住用户原有的键序，否则每次保存都会重排整段 YAML。
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# SQLite（bundled 特性内置 SQLite 源码，免系统依赖）
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# 部署配置模板渲染
handlebars = "6"

# 错误处理
thiserror = "2"

# 路径与文件名处理
dirs = "5"
walkdir = "2"

# YAML 配置读写（Hexo 站点与主题配置均为 YAML）
serde_yaml = "0.9"

[dev-dependencies]
# 启用 tauri 的 mock 运行时，用于测试 managed state 注册与解析
tauri = { version = "2", features = ["test"] }

[features]
# 由 tauri CLI 在构建时注入，用于自定义协议
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
# schemars 0.8.22 的 `preserve_order` 特性错误地启用 indexmap 1.x，而其代码按
# indexmap 2.x 的 API 编写（IndexMap 缺省第三个泛型参数），与 tauri-build /
# tauri-plugin 2.7.x（启用 preserve_order）组合必然编译失败（E0107）。
# 本补丁把 preserve_order 接到该 crate 自带的 indexmap2 路径（官方 2.x 依赖）。
# 上游发布修复版本（schemars 0.8.23+ 或 tauri-build 调整）后可移除本段。
schemars = { path = "patches/schemars-0.8.22" }
