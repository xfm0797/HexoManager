name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 创建 Release 与上传安装包需要写权限：
# GITHUB_TOKEN 默认只读，缺少 contents: write 会导致
# tauri-action 报 "Resource not accessible by integration"
permissions:
  contents: write

# V8 默认的老生代（old space）上限是**按物理内存自动推导**的：
#   16 GB 运行器（ubuntu / windows-latest）→ 约 4 GB，够用；
#    7 GB 运行器（macos-latest）        → 约 2 GB，**必定 OOM**。
# 而本项目 vite/rollup 在 transform 阶段要展开 monaco-editor（含 5 个 worker）
# 与 antd 的模块图，实测堆峰值在 2.0~2.5 GB 之间，因此 macOS 打包会在
# beforeBuildCommand（vite build）阶段抛
#   FATAL ERROR: Ineffective mark-compacts near heap limit
# 显式抬高上限后三平台一致。注意 --max-old-space-size 只是**上限**而非预分配，
# 不会让实际占用变高；这里给 4 GB，对实测峰值有约 1.6 倍余量。
env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  # ===== 代码质量检查 =====
  check:
    name: 类型检查与构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      # 版本号散落 7 文件 8 处，历史上多次漏改（如 constants 停在 1.0.0）
      - name: 版本号一致性检查
        run: npm run version:check

      # 曾经是 continue-on-error：ESLint 一有告警就整片红、没人看，于是长期被忽略。
      # 现在源码已清零（--max-warnings 0），改为硬卡口。
      - name: ESLint 检查
        run: npm run lint

      # 卡住「英文界面漏出中文」：缺译文或英文译文里残留中文都会让本步失败；
      # 同时核对 Rust 侧 `AppError::coded("…")` 的 code 都在 errorCodes.ts 里有条目
      - name: i18n 覆盖率与错误码检查
        run: npm run i18n:check

      - name: 构建前端
        run: npm run build:only

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust 编译检查
        working-directory: ./src-tauri
        run: cargo check --all-targets

      # 本机（Windows）跑不了测试二进制（tauri 目标 0xC0000139），Linux runner 正常，
      # 因此这一步是 Rust 侧 20+ 个回归测试唯一的执行机会
      - name: Rust 单元测试
        working-directory: ./src-tauri
        # pipefail 由 bash 的 -eo pipefail 保证：tee 不吞掉 cargo 的退出码
        run: cargo test --all-targets 2>&1 | tee /tmp/cargo-test.log

      # 单元测试失败时，把失败的用例名与断言写进**注解**。
      # 原因：job 日志的 REST 接口需要认证（403），而 annotations 是公开的 ——
      # 没有本地可跑测试的机器上排查 CI 失败，这是唯一不用登录就能拿到细节的路。
      - name: 汇总失败的单元测试
        if: failure()
        run: |
          echo "以下用例失败（详见上一步日志）："
          grep -E '^(---- |thread .* panicked|assertion|  left:|  right:|test result:)' /tmp/cargo-test.log \
            | head -60 | sed 's/^/::error::/'

      # 本仓库自身的代码当前 0 clippy 告警（已清 6 条：复杂返回类型、len/is_empty 成对、
      # 多余借用、多余 return、游离 doc 注释）。仍保留 continue-on-error：clippy 会随
      # 工具链版本新增 lint，硬卡会让「只是升级了 stable」变成发布阻塞。
      - name: Clippy 检查
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      # rustfmt 输出与版本无关（不随工具链新增规则），因此设为硬卡口；
      # 全仓已 `cargo fmt` 统一，改代码后忘记格式化会在这里被拦下
      - name: Rust 格式检查
        working-directory: ./src-tauri
        run: cargo fmt --check

  # ===== 多平台打包 =====
  #
  # **必须串行执行（max-parallel: 1）**：四个 job 共用同一个 Release，而
  # `tauri-action` 写 `latest.json` 的方式是「读已有资产 → 删同名 → 传新内容」。
  # 并行时 A 拿到的资产 id 在删除前已被 B 替换，GitHub 返回 404，报
  # `Not Found - .../delete-a-release-asset`。v1.2.1 就栽在这里：三个平台成功、
  # Windows job 失败，`latest.json` 缺 `windows-*` 键 —— 安装包齐全，但 Windows
  # 用户收不到自动更新（静默失效，最难发现）。
  # 串行后每个 job 基于上一个 job 的产物合并，代价是总时长从 ~9 分钟变成 ~35 分钟。
  build:
    name: 打包 (${{ matrix.platform }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 打包应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HexoManager ${{ github.ref_name }}'
          releaseBody: '详见 [CHANGELOG.md](./CHANGELOG.md)'
          # 直接发布正式版（非草稿）：推送 v* 标签后立即对用户可见，
          # 自动更新链路 /releases/latest/download/latest.json 也能立刻取到。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ===== 发布产物自检 =====
  #
  # 为什么需要这一步：`latest.json` 少一个平台键**不会**让任何 job 变红 —— 安装包
  # 都在，Release 看起来正常，只有那个平台的自动更新静默失效（v1.2.1 就是这样丢掉
  # windows-* 的）。这里按 tauri v2 的规范键逐个校验，缺哪个就点名报错。
  # `always()` 保证即使某个打包 job 失败，也能拿到「到底缺什么」的结论。
  verify:
    name: 校验更新清单
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 检查 latest.json 是否覆盖所有平台
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/${REPO}/releases/download/${TAG}/latest.json"
          curl -fsSL "$url" -o latest.json
          node - <<'JS'
          const manifest = require('./latest.json');
          const required = [
            'darwin-aarch64',
            'darwin-x86_64',
            'linux-x86_64',
            'windows-x86_64',
            'windows-x86_64-msi',
            'windows-x86_64-nsis',
          ];
          const platforms = manifest.platforms || {};
          const missing = required.filter((k) => !platforms[k] || !platforms[k].signature);
          if (missing.length) {
            console.error(`::error::latest.json 缺少平台键或签名为空：${missing.join(', ')}`);
            console.error(`实际包含：${Object.keys(platforms).join(', ') || '(空)'}`);
            process.exit(1);
          }
          console.log(`更新清单版本 ${manifest.version}，平台齐全：${Object.keys(platforms).join(', ')}`);
          JS
