name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 创建 Release 与上传安装包需要写权限：
# GITHUB_TOKEN 默认只读，缺少 contents: write 会导致
# tauri-action 报 "Resource not accessible by integration"
permissions:
  contents: write

# V8 默认的老生代（old space）上限是**按物理内存自动推导**的：
#   16 GB 运行器（ubuntu / windows-latest）→ 约 4 GB，够用；
#    7 GB 运行器（macos-latest）        → 约 2 GB，**必定 OOM**。
# 而本项目 vite/rollup 在 transform 阶段要展开 monaco-editor（含 5 个 worker）
# 与 antd 的模块图，实测堆峰值在 2.0~2.5 GB 之间，因此 macOS 打包会在
# beforeBuildCommand（vite build）阶段抛
#   FATAL ERROR: Ineffective mark-compacts near heap limit
# 显式抬高上限后三平台一致。注意 --max-old-space-size 只是**上限**而非预分配，
# 不会让实际占用变高；这里给 4 GB，对实测峰值有约 1.6 倍余量。
env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  # ===== 代码质量检查 =====
  check:
    name: 类型检查与构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: ESLint 检查
        run: npm run lint
        continue-on-error: true

      - name: 构建前端
        run: npm run build:only

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust 编译检查
        working-directory: ./src-tauri
        run: cargo check --all-targets

      - name: Clippy 检查
        working-directory: ./src-tauri
        run: cargo clippy --all-targets
        continue-on-error: true

      - name: Rust 格式检查
        working-directory: ./src-tauri
        run: cargo fmt --check
        continue-on-error: true

  # ===== 多平台打包 =====
  build:
    name: 打包 (${{ matrix.platform }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 打包应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HexoManager ${{ github.ref_name }}'
          releaseBody: '详见 [CHANGELOG.md](./CHANGELOG.md)'
          # 直接发布正式版（非草稿）：推送 v* 标签后立即对用户可见，
          # 自动更新链路 /releases/latest/download/latest.json 也能立刻取到。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
